<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Quest</title>
    <link rel="stylesheet" href="style 2.css">
    <script src="java.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="title">
            <h1>Campus Quest</h1>
            <p>Mission Tracker</p>
            <p>Small steps. Big goals!</p>
        </div>

        <div>
            <button class="btn" id="colourBtn">Change Colour</button>
        </div>
    </div>

    <div class="sectionhero">
        <div class="searchbar">
            <input class="bar" id="missionInput" type="text" placeholder="Enter a mission...">
        </div>
        <div class="add">
            <button class="bar2" id="addBtn">+ Add Mission</button>
        </div>
    </div>

    <div class="boxs">
        <div class="box1">
            <p>Total Missions: <span id="totalCount">0</span></p>
        </div>
        <div class="box2">
            <p>Completed Missions: <span id="completedCount">0</span></p>
        </div>
        <div class="box3">
            <p>Pending Missions: <span id="pendingCount">0</span></p>
        </div>
    </div>

    <div class="center">
        <h2>My Missions</h2>
    </div>

    <div class="content" id="missionList"></div>
</body>
</html>
